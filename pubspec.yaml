name: educate_card
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^3.8.5
  card_swiper: ^2.0.4
  introduction_screen: ^3.1.12
  showcaseview: ^3.0.0
  shared_preferences: ^2.2.2
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo_flashcard.svg
    - assets/resources/
    - assets/resources/gambar-momentum.png
